aid: flytrex
name: Flytrex
description: 'Flytrex is an autonomous drone delivery operator headquartered in Tel
  Aviv, Israel, with US operations centered on the Dallas-Fort Worth metroplex and
  North Carolina. The company runs an end-to-end backyard delivery service that flies
  food and small goods from partner restaurants and retailers to consumer homes in
  roughly five minutes, operating its own Sky-series multirotor aircraft, ground docks,
  and a remote-operations control center. Flytrex sells to consumers through its own
  iOS and Android ordering apps and to merchants through a partner portal, and routes
  demand from third-party marketplaces including DoorDash and Uber Eats. It does not
  currently publish a public developer program, API reference, or machine-readable
  specification.'
